<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0b1517;
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, sans-serif;
    color: #f2f2f2;
    display: flex;
    align-items: center;
  }
  .left { width: 520px; padding-left: 72px; box-sizing: border-box; }
  .icon { width: 96px; height: 96px; display: block; margin-bottom: 26px; }
  h1 { font-size: 112px; font-weight: 900; letter-spacing: -3px; margin: 0; line-height: 1; }
  svg.squiggle { display: block; margin: 6px 0 26px 4px; }
  p { font-size: 34px; line-height: 1.3; color: #bdbdbd; margin: 0 0 26px; }
  .url { font-size: 26px; color: #8a8a8a; }
  .right { flex: 1; height: 100%; position: relative; }
  .shot { position: absolute; left: 0; top: 60px; width: 780px; border-radius: 16px; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
</style>
</head>
<body>
  <div class="left">
    <img class="icon" src="icon-clean.png" alt="">
    <h1>messy</h1>
    <svg class="squiggle" width="300" height="26" viewBox="0 0 300 26">
      <path d="M4 13 C 30 0, 50 26, 76 13 S 122 0, 148 13 S 194 26, 220 13 S 266 0, 296 13" fill="none" stroke="#FF856B" stroke-width="7" stroke-linecap="round"/>
    </svg>
    <p>A free, open-source cleaner for your Mac</p>
    <div class="url">brk.bz/messy</div>
  </div>
  <div class="right">
    <img class="shot" src="screenshots/results.png" alt="">
  </div>
</body>
</html>
