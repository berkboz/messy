<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #141414;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
    color: #f2f2f2;
    display: flex;
    align-items: center;
  }
  .left { width: 520px; padding-left: 72px; box-sizing: border-box; }
  .icon { width: 88px; height: 88px; display: block; margin-bottom: 28px; }
  h1 { font-size: 104px; font-weight: 700; letter-spacing: -2px; margin: 0 0 18px; line-height: 1; }
  p { font-size: 34px; line-height: 1.3; color: #bdbdbd; margin: 0 0 26px; }
  .rule { width: 72px; height: 4px; background: #e5484d; margin-bottom: 22px; }
  .url { font-size: 26px; color: #8a8a8a; }
  .right { flex: 1; height: 100%; position: relative; }
  .shot {
    position: absolute; left: 0; top: 56px; width: 760px;
    border-radius: 14px; box-shadow: 0 30px 80px rgba(0,0,0,.6);
  }
</style>
</head>
<body>
  <div class="left">
    <img class="icon" src="icon-clean.png" alt="">
    <h1>Messy</h1>
    <p>A free, open-source cleaner for your Mac</p>
    <div class="rule"></div>
    <div class="url">brk.bz/messy</div>
  </div>
  <div class="right">
    <img class="shot" src="shots/uninstall.png" alt="">
  </div>
</body>
</html>
