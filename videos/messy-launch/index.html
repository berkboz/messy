<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #071A1C;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="25"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-dust"
        class="scene"
        data-composition-id="01-dust"
        data-composition-src="compositions/frames/01-dust.html"
        data-start="0"
        data-duration="3.9"
        data-track-index="0"
      ></div>

      <div
        id="el-02-meet"
        class="scene"
        data-composition-id="02-meet"
        data-composition-src="compositions/frames/02-meet.html"
        data-start="3.5"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-03-checkup"
        class="scene"
        data-composition-id="03-checkup"
        data-composition-src="compositions/frames/03-checkup.html"
        data-start="7"
        data-duration="5.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-results"
        class="scene"
        data-composition-id="04-results"
        data-composition-src="compositions/frames/04-results.html"
        data-start="12"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-features"
        class="scene"
        data-composition-id="05-features"
        data-composition-src="compositions/frames/05-features.html"
        data-start="16.5"
        data-duration="5.1"
        data-track-index="0"
      ></div>

      <div
        id="el-06-outro"
        class="scene"
        data-composition-id="06-outro"
        data-composition-src="compositions/frames/06-outro.html"
        data-start="21"
        data-duration="4"
        data-track-index="1"
      ></div>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/music/messy-bed.wav"
        data-start="0"
        data-duration="25"
        data-track-index="11"
        data-volume="0.5"
      ></audio>

      <!-- SFX -->
      <audio
        id="el-sfx-0"
        src="assets/sfx/found.wav"
        data-start="4"
        data-duration="0.75"
        data-track-index="20"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-1"
        src="assets/sfx/tick.wav"
        data-start="9.15"
        data-duration="0.05"
        data-track-index="21"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-2"
        src="assets/sfx/scan.wav"
        data-start="9.4"
        data-duration="0.85"
        data-track-index="22"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-3"
        src="assets/sfx/found.wav"
        data-start="12.85"
        data-duration="0.75"
        data-track-index="23"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-4"
        src="assets/sfx/trash.wav"
        data-start="21.5"
        data-duration="0.32"
        data-track-index="24"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-5"
        src="assets/sfx/done.wav"
        data-start="22.5"
        data-duration="1.3"
        data-track-index="25"
        data-volume="0.35"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-dust", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 3.5);
        tl.fromTo("#el-02-meet", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 3.5);
        tl.to("#el-02-meet", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 7);
        tl.fromTo("#el-03-checkup", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 7);
        tl.to("#el-03-checkup", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 12);
        tl.fromTo("#el-04-results", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 12);
        tl.to("#el-04-results", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 16.5);
        tl.fromTo("#el-05-features", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 16.5);
        tl.to("#el-05-features", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 21);
        tl.fromTo("#el-06-outro", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 21);
        tl.to({}, { duration: 25 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
