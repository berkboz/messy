<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #071A1C;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="32"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-mess"
        class="scene"
        data-composition-id="01-mess"
        data-composition-src="compositions/frames/01-mess.html"
        data-start="0"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-02-asks"
        class="scene"
        data-composition-id="02-asks"
        data-composition-src="compositions/frames/02-asks.html"
        data-start="4"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-03-sweep"
        class="scene"
        data-composition-id="03-sweep"
        data-composition-src="compositions/frames/03-sweep.html"
        data-start="8"
        data-duration="2"
        data-track-index="1"
      ></div>

      <div
        id="el-04-scan"
        class="scene"
        data-composition-id="04-scan"
        data-composition-src="compositions/frames/04-scan.html"
        data-start="10"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-05-results"
        class="scene"
        data-composition-id="05-results"
        data-composition-src="compositions/frames/05-results.html"
        data-start="14"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-06-everything"
        class="scene"
        data-composition-id="06-everything"
        data-composition-src="compositions/frames/06-everything.html"
        data-start="18"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-07-trust"
        class="scene"
        data-composition-id="07-trust"
        data-composition-src="compositions/frames/07-trust.html"
        data-start="22"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-08-outro"
        class="scene"
        data-composition-id="08-outro"
        data-composition-src="compositions/frames/08-outro.html"
        data-start="26"
        data-duration="6"
        data-track-index="1"
      ></div>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/music/messy-soundtrack.wav"
        data-start="0"
        data-duration="32"
        data-track-index="11"
        data-volume="0.9"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
