<template>

  <style>

    .ck-mask { position: absolute; left: 0; width: 1920px; top: 236px; height: 140px; overflow: hidden; }

      display: grid; place-items: center; font-size: 26px; font-weight: 600; color: #052a1c; }
    .ck-card { position: absolute; top: 622px; width: 380px; height: 250px; border-radius: 28px; padding: 30px 32px; box-sizing: border-box;
      background: #111b1a; border: 1.5px solid rgba(255,255,255,0.07); }
    .ck-card .h { display: flex; align-items: center; justify-content: space-between; font-size: 24px; font-weight: 600; color: rgba(243,246,245,0.8); }
    .ck-card .tk { width: 32px; height: 32px; border-radius: 9px; background: #3dcb8e; display: grid; place-items: center; }
    .ck-card .v { margin-top: 26px; font-size: 64px; font-weight: 600; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; }
    .ck-card .v.c { color: #ff7a5c; }
    .ck-card p { margin: 10px 0 0; font-size: 19px; line-height: 1.4; color: rgba(243,246,245,0.5); }
    #ck-dock { position: absolute; left: 600px; top: 930px; width: 720px; height: 112px; border-radius: 30px; background: rgba(255,255,255,0.08);
      border: 1.5px solid rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; gap: 18px; backdrop-filter: blur(20px); }
    .ck-app { width: 80px; height: 80px; border-radius: 20px; }
    .ck-sep { width: 2px; height: 70px; background: rgba(255,255,255,0.15); }
    #ck-trash { width: 84px; height: 84px; position: relative; }
    #ck-files { position: absolute; left: 0; top: 0; }
    .ck-file { position: absolute; left: 0; top: 0; width: 46px; height: 58px; }
    #ck-cursor { position: absolute; left: 0; top: 0; width: 46px; height: 46px; }
    #ck-ripple { position: absolute; left: 0; top: 0; width: 60px; height: 60px; border-radius: 50%; border: 3px solid #7be8bd; opacity: 0; }
  </style>

  <div id="root" data-composition-id="02-checkup" data-width="1920" data-height="1080" data-duration="10.5">
    <div id="ck-bg" class="clip" data-start="0" data-duration="10.5" data-track-index="0"></div>
    <div id="ck-stage" class="clip" data-start="0" data-duration="10.5" data-track-index="1" data-layout-allow-overflow>
      <div class="ck-mask"><div class="ck-line" id="ck-l1"></div><div class="ck-line" id="ck-l2"></div><div class="ck-line" id="ck-l3"></div><div class="ck-line" id="ck-l4"></div></div>
      <div id="ck-world" data-layout-allow-overflow>
        <svg id="ck-svg" width="1920" height="1080" viewBox="0 0 1920 1080">
          <defs><linearGradient id="ck-green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ee0a8" /><stop offset="1" stop-color="#2fb07c" /></linearGradient>
            <linearGradient id="ck-arcg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7be8bd" /><stop offset="1" stop-color="#2fb07c" /></linearGradient></defs>
          <rect id="ck-panel" x="810" y="518" width="300" height="84" rx="42" fill="#111b1a" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" opacity="0" />
          <circle id="ck-track" cx="960" cy="640" r="160" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="18" opacity="0" />
          <circle id="ck-arc" cx="960" cy="640" r="160" fill="none" stroke="url(#ck-arcg)" stroke-width="18" stroke-linecap="round" transform="rotate(-90 960 640)" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
          <rect id="ck-shape" x="810" y="518" width="300" height="84" rx="42" fill="url(#ck-green)" />
        </svg>
        <div id="ck-scan">Scan</div>
        <img id="ck-broom" src="assets/mascot-sweep.png" alt="" />
        <div id="ck-pct">Hunting for mess… 0%</div>
        <div id="ck-chips"></div>
        <div id="ck-banner-text"><b>Found 86,8 MB to clean, 3 things to look at.</b><span>Nothing has changed yet. Untick anything you want to keep.</span></div>
        <div id="ck-run">Run</div>
        <div class="ck-card" id="ck-c0" style="left:360px"><div class="h">Junk<div class="tk"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M5.5 12.5 L10 17 L18.5 7.5" stroke="#052a1c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div><div class="v c" id="ck-junk">0 MB</div><p>Caches, logs and developer leftovers.</p></div>
        <div class="ck-card" id="ck-c1" style="left:770px"><div class="h">Threats</div><div class="v">3 items</div><p>Checked where malware usually hides.</p></div>
        <div class="ck-card" id="ck-c2" style="left:1180px"><div class="h">Maintenance<div class="tk"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M5.5 12.5 L10 17 L18.5 7.5" stroke="#052a1c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div><div class="v">3 tasks</div><p>Flush DNS, reset Quick Look, rebuild Open With.</p></div>
        <div id="ck-dock">
          <div class="ck-app" style="background:linear-gradient(160deg,#6aa9ff,#3b6fe0)"></div>
          <div class="ck-app" style="background:linear-gradient(160deg,#ffd36a,#f2a33a)"></div>
          <div class="ck-app" style="background:linear-gradient(160deg,#9b8cff,#6c5ce0)"></div>
          <div class="ck-app" style="background:linear-gradient(160deg,#ff8fa3,#e0566f)"></div>
          <img class="ck-app" src="assets/messy-icon.png" alt="" />
          <div class="ck-sep"></div>
          <svg id="ck-trash" viewBox="0 0 84 84">
            <path d="M18 22 H66 L61 76 Q60.5 80 56.5 80 H27.5 Q23.5 80 23 76 Z" fill="rgba(255,255,255,0.16)" stroke="rgba(255,255,255,0.55)" stroke-width="2.5" stroke-linejoin="round"/>
            <g id="ck-paper" opacity="0"><rect x="27" y="12" width="16" height="20" rx="2" fill="#ffd2c6" transform="rotate(-14 35 22)"/><rect x="39" y="10" width="16" height="20" rx="2" fill="#ff9a7f" transform="rotate(9 47 20)"/><rect x="33" y="16" width="18" height="16" rx="2" fill="#fff"/></g>
            <path d="M30 34 V70 M42 34 V70 M54 34 V70" stroke="rgba(255,255,255,0.4)" stroke-width="2.5" stroke-linecap="round"/>
            <rect x="14" y="17" width="56" height="6" rx="3" fill="rgba(255,255,255,0.6)"/>
          </svg>
        </div>
        <div id="ck-files"></div>
        <div id="ck-ripple"></div>
        <svg id="ck-cursor" viewBox="0 0 24 24"><path d="M4 2.5 L4 19 L8.6 14.8 L11.6 21.4 L14.4 20.2 L11.5 13.8 L17.6 13.6 Z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const DURATION = 10.5;
      const tl = gsap.timeline({ paused: true });
      const $ = (id) => document.getElementById(id);
      const EO = (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));
      const EI = (p) => (p <= 0 ? 0 : Math.pow(2, 10 * (p - 1)));
      const LANG = (() => { try { const v = window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables(); return (v && v.lang) || "en"; } catch (e) { return "en"; } })();
      const T = (en, tr) => (LANG === "tr" ? tr : en);

      // Headlines (the first is already on screen from frame 01).
      const lines = [
        { id: "ck-l1", html: T("One click finds it.", "Tek tıkla bulur."), in: null, out: 1.3 },
        { id: "ck-l2", html: T('It checks <span class="m">everything at once.</span>', 'Her şeye <span class="m">aynı anda bakar.</span>'), in: 1.65, out: 4.15 },
        { id: "ck-l3", html: T('Nothing changes <span class="m">until you press Run.</span>', 'Run’a basmadan <span class="m">hiçbir şey değişmez.</span>'), in: 4.5, out: 7.55 },
        { id: "ck-l4", html: T('Everything goes <span class="m">to the Trash first.</span>', 'Her şey önce <span class="m">Çöp Sepeti’ne gider.</span>'), in: 7.9, out: 9.95 },
      ];
      lines.forEach((l) => {
        const el = $(l.id);
        el.innerHTML = l.html;
        if (l.in === null) gsap.set(el, { yPercent: 0 });
        else { gsap.set(el, { yPercent: 115 }); tl.fromTo(el, { yPercent: 115, filter: "blur(8px)" }, { yPercent: 0, filter: "blur(0px)", duration: 0.75, ease: EO }, l.in); }
        tl.to(el, { yPercent: -115, filter: "blur(8px)", duration: 0.32, ease: EI }, l.out);
      });

      // The morphing hero shape: pill → ring → banner.
      const S = { x: 810, y: 518, w: 300, h: 84, r: 42 };
      const shapeIds = ["ck-shape", "ck-panel"];
      const draw = () => shapeIds.forEach((id) => {
        const r = $(id);
        r.setAttribute("x", S.x.toFixed(1)); r.setAttribute("y", S.y.toFixed(1));
        r.setAttribute("width", S.w.toFixed(1)); r.setAttribute("height", S.h.toFixed(1)); r.setAttribute("rx", S.r.toFixed(1));
      });
      draw();

      // Cursor walks in and clicks on the beat.
      const cur = $("ck-cursor");
      const CX = 968, CY = 566;
      gsap.set(cur, { x: 1500, y: 1120 });
      tl.to(cur, { x: CX, y: CY, duration: 0.7, ease: EO }, 0.0);
      tl.to("#ck-shape, #ck-scan", { scale: 0.93, transformOrigin: "960px 560px", duration: 0.07, ease: EI }, 0.74);
      tl.to("#ck-shape, #ck-scan", { scale: 1, duration: 0.5, ease: EO }, 0.81);
      tl.fromTo("#ck-ripple", { x: CX - 30, y: CY - 30, scale: 0.4, opacity: 0.9 }, { scale: 3.2, opacity: 0, duration: 0.6, ease: EO }, 0.78);
      tl.to(cur, { x: CX + 380, y: CY + 260, opacity: 0, duration: 0.5, ease: EI }, 1.05);
      tl.to("#ck-world", { scale: 1.035, transformOrigin: "960px 600px", duration: 0.5, ease: EO }, 0.78);
      tl.to("#ck-world", { scale: 1, duration: 0.9, ease: EO }, 1.3);

      // Pill becomes the ring.
      tl.to("#ck-scan", { opacity: 0, scale: 0.8, duration: 0.25, ease: EI }, 0.95);
      tl.fromTo(S, { x: 810, y: 518, w: 300, h: 84, r: 42 }, { x: 800, y: 480, w: 320, h: 320, r: 160, duration: 0.8, ease: EO, onUpdate: draw, immediateRender: false }, 1.0);
      tl.to("#ck-shape", { opacity: 0, duration: 0.55, ease: EO }, 1.35);
      tl.to("#ck-track", { opacity: 1, duration: 0.4, ease: EO }, 1.4);
      tl.fromTo("#ck-broom", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.6, ease: EO }, 1.4);
      tl.fromTo("#ck-arc", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 2.4, ease: (p) => p * p * (3 - 2 * p) }, 1.7);
      // the broom works while it looks (a sweep every half beat), then rests
      [-12, 10, -10, 12, -9, 9, -6].forEach((r, i) => tl.to("#ck-broom", { rotation: r, transformOrigin: "50% 12%", duration: 0.33, ease: i % 2 ? EO : EI }, 1.75 + i * 0.33));
      tl.to("#ck-broom", { rotation: 0, duration: 0.4, ease: EO }, 4.06);

      tl.fromTo("#ck-pct", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: EO }, 1.6);
      const pct = { v: 0 };
      tl.to(pct, { v: 100, duration: 2.4, ease: (p) => p * p * (3 - 2 * p), onUpdate: () => { $("ck-pct").textContent = pct.v >= 99.5 ? "Done looking." : "Hunting for mess… " + Math.round(pct.v) + "%"; } }, 1.7);
      tl.set("#ck-pct", { textContent: "Hunting for mess… 0%" }, 0);

      const CHECK = '<svg viewBox="0 0 22 22"><circle cx="11" cy="11" r="11" fill="#3dcb8e"/><path d="M6.5 11.3 L9.6 14.2 L15.6 8" stroke="#052a1c" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      ["Junk", "Threats", "Maintenance", "Duplicates", "App updates"].forEach((name, i) => {
        const el = document.createElement("div");
        el.className = "ck-chip"; el.id = "ck-chip-" + i;
        el.innerHTML = '<span class="d">' + CHECK + "</span>" + name;
        $("ck-chips").appendChild(el);
        tl.fromTo(el, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: EO }, 1.7 + i * 0.06);
        const t = 2.0 + i * 0.5;
        tl.to(el.querySelector("svg"), { opacity: 1, duration: 0.1, ease: EO }, t);
        tl.to(el, { color: "#f3f6f5", borderColor: "rgba(61,203,142,0.5)", background: "rgba(61,203,142,0.12)", duration: 0.35, ease: EO }, t);
      });

      // Ring opens into the results banner; the broom slides to its corner.
      const B = 4.2;
      tl.to(["#ck-pct", "#ck-chips"], { opacity: 0, y: 30, duration: 0.3, ease: EI }, B - 0.05);
      tl.to(["#ck-track", "#ck-arc"], { opacity: 0, duration: 0.25, ease: EI }, B);
      tl.set("#ck-panel", { opacity: 1 }, B);
      tl.fromTo(S, { x: 800, y: 480, w: 320, h: 320, r: 160 }, { x: 360, y: 440, w: 1200, h: 150, r: 30, duration: 0.8, ease: EO, onUpdate: draw, immediateRender: false }, B);
      tl.to("#ck-broom", { x: -455, y: -100, scale: 0.6, duration: 0.8, ease: EO }, B);
      tl.fromTo("#ck-banner-text", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: EO }, B + 0.5);
      tl.fromTo("#ck-run", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.6, ease: EO }, B + 0.6);
      ["#ck-c0", "#ck-c1", "#ck-c2"].forEach((c, i) =>
        tl.fromTo(c, { opacity: 0, y: 140 }, { opacity: 1, y: 0, duration: 0.8, ease: EO }, B + 0.65 + i * 0.08));
      const junk = { v: 0 };
      tl.to(junk, { v: 86.8, duration: 1.2, ease: EO, onUpdate: () => { $("ck-junk").textContent = junk.v.toFixed(1).replace(".", ",") + " MB"; } }, B + 0.8);
      tl.set("#ck-junk", { textContent: "0 MB" }, 0);

      // Run is clicked.
      const RX = 1446, RY = 520;
      tl.set(cur, { opacity: 1, x: 1820, y: 1100 }, 6.4);
      tl.to(cur, { x: RX, y: RY, duration: 0.75, ease: EO }, 6.45);
      tl.to("#ck-run", { scale: 0.92, duration: 0.07, ease: EI }, 7.36);
      tl.to("#ck-run", { scale: 1, duration: 0.45, ease: EO }, 7.43);
      tl.fromTo("#ck-ripple", { x: RX - 30, y: RY - 30, scale: 0.4, opacity: 0.9 }, { scale: 3, opacity: 0, duration: 0.6, ease: EO, immediateRender: false }, 7.4);
      tl.to(cur, { x: RX + 300, y: RY + 500, opacity: 0, duration: 0.5, ease: EI }, 7.7);

      // The Dock rises and the junk goes into the Trash, file by file.
      tl.to(["#ck-c1", "#ck-c2"], { y: 60, opacity: 0, duration: 0.45, ease: EI }, 7.55);
      tl.to(["#ck-banner-text", "#ck-run", "#ck-panel", "#ck-broom"], { opacity: 0, y: -24, duration: 0.4, ease: EI }, 7.6);
      tl.fromTo("#ck-dock", { y: 220 }, { y: 0, duration: 0.8, ease: EO }, 7.6);
      tl.to("#ck-c0", { scale: 0.86, y: -40, duration: 0.6, ease: EO }, 7.6);
      const FILE = '<svg viewBox="0 0 46 58"><path d="M4 4 H30 L42 16 V54 H4 Z" fill="#ffd2c6"/><path d="M30 4 V16 H42" fill="#ff9a7f"/><path d="M11 28 H35 M11 36 H35 M11 44 H27" stroke="#ff7a5c" stroke-width="3" stroke-linecap="round"/></svg>';
      const TX = 1192, TY = 947;
      for (let i = 0; i < 14; i++) {
        const el = document.createElement("div");
        el.className = "ck-file"; el.id = "ck-file-" + i; el.innerHTML = FILE;
        $("ck-files").appendChild(el);
        const sx = 420 + (i % 5) * 52, sy = 640 + Math.floor(i / 5) * 46;
        const t = 7.85 + i * 0.07;
        gsap.set(el, { x: sx, y: sy, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { x: TX, duration: 0.7, ease: "none" }, t);
        tl.to(el, { y: sy - 150 - (i % 3) * 30, duration: 0.3, ease: EO }, t);
        tl.to(el, { y: TY, duration: 0.4, ease: EI }, t + 0.3);
        tl.to(el, { scale: 0.45, rotation: (i % 2 ? 1 : -1) * (30 + i * 4), duration: 0.7, ease: EI }, t);
        tl.set(el, { opacity: 0 }, t + 0.7);
      }
      tl.to("#ck-c0", { y: 60, opacity: 0, duration: 0.5, ease: EI }, 8.7);
      tl.set("#ck-paper", { opacity: 1 }, 8.6);
      tl.to("#ck-trash", { y: -8, duration: 0.08, ease: EO }, 8.6);
      tl.to("#ck-trash", { y: 0, duration: 0.5, ease: EO }, 8.68);

      // Exit: the whole world accelerates left, so frame 03 can arrive already moving left.
      tl.to("#ck-world", { x: -900, filter: "blur(10px)", duration: 0.55, ease: EI }, 9.95);

      tl.set({}, {}, DURATION);
      window.__timelines = window.__timelines || {};
      window.__timelines["02-checkup"] = tl;
    })();
  </script>
</template>
