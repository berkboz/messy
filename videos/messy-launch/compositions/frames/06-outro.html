    [class~="f06-outro-broom"] {

      width: 420px;

    }
    [class~="f06-outro-broom"] img {

    /* ── Scene 2: lockup ── */
    [class~="f06-outro-iconwrap"] {

  <div

    data-start="0"

    data-width="1920"
    data-height="1080"
  >
    <div class="f06-outro-bg clip" data-start="0" data-duration="4" data-track-index="0"></div>

    <div class="f06-outro-stage clip" data-start="0" data-duration="4" data-track-index="1">
      <!-- closing atmosphere -->
      <div id="f06-outro-glow" class="f06-outro-glow" style="opacity: 0"></div>
      <div id="f06-outro-ring1" class="f06-outro-ring" style="left: 660px; top: 0px; width: 600px; height: 600px; opacity: 0"></div>
      <div id="f06-outro-ring2" class="f06-outro-ring" style="left: 510px; top: -150px; width: 900px; height: 900px; opacity: 0"></div>

      <!-- Scene 1 -->
      <div id="f06-outro-floor" class="f06-outro-floor"></div>

      <div id="f06-outro-b1" class="f06-outro-bunny f06-outro-b1">
        <img id="f06-outro-b1-scared" src="assets/dust-scared.png" alt="" />

      </div>
      <div id="f06-outro-b2" class="f06-outro-bunny f06-outro-b2">
        <img id="f06-outro-b2-scared" src="assets/dust-scared.png" alt="" />
        <img id="f06-outro-b2-gone" src="assets/dust-gone.png" alt="" style="opacity: 0" />
      </div>
      <div id="f06-outro-b3" class="f06-outro-bunny f06-outro-b3">
        <img id="f06-outro-b3-scared" src="assets/dust-scared.png" alt="" />
        <img id="f06-outro-b3-gone" src="assets/dust-gone.png" alt="" style="opacity: 0" />
      </div>

      <!-- Scene 2: lockup -->
      <div class="f06-outro-iconwrap">
        <div id="f06-outro-burst" class="f06-outro-burst" style="opacity: 0"></div>

      </div>
      <div id="f06-outro-wordmark" class="f06-outro-wordmark" style="opacity: 0">messy</div>
      <svg class="f06-outro-squiggle" viewBox="0 0 430 56" xmlns="http://www.w3.org/2000/svg">
        <path
          id="f06-outro-squiggle-path"
          pathLength="1"
          d="M 10 30 C 42 8, 74 8, 104 26 S 160 48, 196 30 S 252 6, 290 24 S 352 46, 386 26 Q 404 16, 420 20"
          style="stroke-dasharray: 1; stroke-dashoffset: 1"
        />
      </svg>

      <!-- Scene 3 -->
      <div id="f06-outro-free" class="f06-outro-sub f06-outro-free" style="opacity: 0">Free &amp; open source</div>
      <div id="f06-outro-url" class="f06-outro-sub f06-outro-url" style="opacity: 0">brk.bz/messy</div>

      <!-- the broom rides on top of everything while it sweeps -->
      <div id="f06-outro-broom" class="f06-outro-broom">
        <img src="assets/mascot-sweep.png" alt="" />
      </div>

  </div>

  <script>
    (function () {
      const FRAME_ID = "06-outro";
      const DURATION = 4;
      const $ = (id) => document.getElementById(id);

      const floor = $("f06-outro-floor");
      const broom = $("f06-outro-broom");
      const bunnies = [1, 2, 3].map((n) => ({
        wrap: $("f06-outro-b" + n),
        scared: $("f06-outro-b" + n + "-scared"),
        gone: $("f06-outro-b" + n + "-gone"),
        centerX: [620, 960, 1300][n - 1],
      }));
      const icon = $("f06-outro-icon");
      const burst = $("f06-outro-burst");
      const glow = $("f06-outro-glow");
      const ring1 = $("f06-outro-ring1");
      const ring2 = $("f06-outro-ring2");
      const wordmark = $("f06-outro-wordmark");
      const squiggle = $("f06-outro-squiggle-path");
      const free = $("f06-outro-free");
      const url = $("f06-outro-url");

      const tl = gsap.timeline({ paused: true });

      // ── Scene 1 (0.0–1.6s): broom sweeps left -> right; bunnies hard-swap to sparkles ──
      // Floor + bunnies on screen from the first frames.
      tl.fromTo(floor, { opacity: 0, scaleX: 0.6 }, { opacity: 1, scaleX: 1, duration: 0.35, ease: "power2.out" }, 0);
      bunnies.forEach((b, i) => {
        tl.fromTo(
          b.wrap,
          { opacity: 0, scale: 0.7, transformOrigin: "50% 100%" },
          { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" },
          0.04 + i * 0.05,
        );
      });

      // Broom travel: linear so contact times are computable from geometry.
      const BROOM_W = 420;
      const BRISTLE_X = 0.42 * BROOM_W; // bristle centre inside the image box
      const X0 = -BROOM_W - 20; // fully off-frame left
      const X1 = 1920 + 40; // fully off-frame right
      const SWEEP_START = 0.15;
      const SWEEP_DUR = 1.45; // exits right at 1.6s
      tl.fromTo(broom, { x: X0 }, { x: X1, duration: SWEEP_DUR, ease: "none" }, SWEEP_START);

      // Rocking as it goes: explicit back-and-forth keyframes (no repeat/yoyo).
      const ROCK = [-10, 9, -9, 9, -8, 8, -6];
      const ROCK_STEP = SWEEP_DUR / ROCK.length;
      tl.set(broom, { rotation: -4 }, 0);
      ROCK.forEach((deg, i) => {
        tl.to(broom, { rotation: deg, duration: ROCK_STEP, ease: "sine.inOut" }, SWEEP_START + i * ROCK_STEP);
      });
      // small bob in step with the rocking
      ROCK.forEach((deg, i) => {
        tl.to(broom, { y: i % 2 === 0 ? -14 : 0, duration: ROCK_STEP, ease: "sine.inOut" }, SWEEP_START + i * ROCK_STEP);
      });

      // Contact: the instant the bristles reach each bunny's centre.
      bunnies.forEach((b, i) => {
        const contactX = b.centerX - BRISTLE_X; // broom left edge at contact
        const t = SWEEP_START + ((contactX - X0) / (X1 - X0)) * SWEEP_DUR;

        // scared jitter while the broom approaches (deterministic keyframes)
        const jitterStart = 0.4;
        const steps = Math.max(2, Math.floor((t - jitterStart) / 0.06));
        for (let k = 0; k < steps; k++) {
          tl.to(b.scared, { x: k % 2 === 0 ? -5 : 5, duration: 0.06, ease: "none" }, jitterStart + k * 0.06);
        }

        // instant swap: scared -> sparkle puff (no crossfade)
        tl.set(b.scared, { opacity: 0 }, t);
        tl.set(b.gone, { opacity: 1 }, t);
        // the puff is flung up-right and dissolves
        tl.fromTo(
          b.gone,
          { x: 0, y: 0, scale: 1 },
          { x: 70, y: -50, scale: 1.2, duration: 0.5, ease: "power2.out", immediateRender: false },
          t,
        );
        tl.to(b.gone, { opacity: 0, duration: 0.4, ease: "power1.in" }, t + 0.12);
      });

      // floor line clears behind the broom
      tl.to(floor, { opacity: 0, duration: 0.35, ease: "power1.in" }, 1.3);

      // ── Scene 2 (1.6–2.8s): icon pop + press-release spring, wordmark, squiggle draw ──
      const ICON_IN = 1.5;
      tl.fromTo(
        icon,
        { opacity: 0, scale: 0.4 },
        { opacity: 1, scale: 1, duration: 0.22, ease: "power2.out" },
        ICON_IN,
      );
      // press: linear-ish compression
      const PRESS_START = ICON_IN + 0.22;
      const PRESS_DUR = 0.12;
      const PRESS_SCALE = 0.9;
      tl.to(icon, { scale: PRESS_SCALE, duration: PRESS_DUR, ease: "power1.in" }, PRESS_START);
      // release: spring back (adjacent position = state continuity)
      const RELEASE_START = PRESS_START + PRESS_DUR;
      tl.to(icon, { scale: 1, duration: 0.6, ease: "back.out(2.2)" }, RELEASE_START);
      // burst glow behind the icon
      tl.fromTo(burst, { scale: 1, opacity: 0 }, { scale: 2.4, opacity: 0.6, duration: 0.45, ease: "power2.out" }, RELEASE_START);
      tl.to(burst, { opacity: 0, duration: 0.55, ease: "power2.in" }, RELEASE_START + 0.45);
      // environmental glow + closing rings settle in
      tl.fromTo(glow, { opacity: 0 }, { opacity: 0.22, duration: 0.8, ease: "power2.out" }, RELEASE_START);
      tl.fromTo(ring1, { opacity: 0, scale: 0.85 }, { opacity: 0.6, scale: 1, duration: 0.9, ease: "power2.out" }, RELEASE_START);
      tl.fromTo(ring2, { opacity: 0, scale: 0.85 }, { opacity: 0.35, scale: 1, duration: 1.0, ease: "power2.out" }, RELEASE_START + 0.1);

      // wordmark under the icon
      const WORD_IN = 2.0;
      tl.fromTo(
        wordmark,
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        WORD_IN,
      );
      // coral squiggle self-draws (pathLength normalised to 1)
      tl.fromTo(
        squiggle,
        { strokeDashoffset: 1 },
        { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
        WORD_IN + 0.25,
      );

      // ── Scene 3 (2.8–4.0s): sub-lines fade up, then hold still ──
      tl.fromTo(free, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power1.out" }, 2.85);
      tl.fromTo(url, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power1.out" }, 3.05);
      // everything has settled by ~3.5s; the lockup holds dead still to the final frame.

      tl.set({}, {}, DURATION);

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
    })();
  </script>
