<template>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>

    #root {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: "Nunito", sans-serif;
      color: #eaf7f4;
    }

    .features05-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 50% 58%, rgba(31, 191, 115, 0.07) 0%, rgba(7, 26, 28, 0) 70%),
        #071a1c;
    }

    #features05-stage {
      position: absolute;
      inset: 0;
      will-change: transform;
    }

    /* Fan (burst-wrap): items are centred on the canvas, x/y tween offsets only */
    #features05-fan {
      position: absolute;
      inset: 0;
      will-change: transform, opacity;
    }

    .features05-item {
      position: absolute;
      top: 50%;
      left: 50%;
      will-change: transform, opacity;
    }

    .features05-card {
      position: relative;
      padding: 10px;
      border-radius: 14px;
      background: #0b2427;
      border: 1.5px solid rgba(84, 214, 194, 0.22);
    }

    .features05-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 14px;
      background: rgba(84, 214, 194, 0.06);
      pointer-events: none;
    }

    .features05-shot {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 8px;
      object-fit: cover;
      object-position: top center;
    }

    .features05-item--side .features05-card {
      width: 560px;
      height: 393px;
    }

    .features05-item--center .features05-card {
      width: 720px;
      height: 506px;
    }

    .features05-item--left { z-index: 1; }
    .features05-item--right { z-index: 1; }
    .features05-item--center { z-index: 3; }

    .features05-pill {
      position: absolute;
      left: 0;
      right: 0;
      margin: 0 auto;
      width: max-content;
      top: calc(100% + 22px);
      padding: 10px 28px 11px;
      border-radius: 100px;
      background: rgba(31, 191, 115, 0.15);
      border: 1.5px solid rgba(31, 191, 115, 0.35);
      color: #1fbf73;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.01em;
      line-height: 1;
      white-space: nowrap;
    }

    /* Trust line, upper third */
    #features05-trust {
      position: absolute;
      left: 0;
      right: 0;
      top: 120px;
      text-align: center;
      font-size: 56px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .features05-phrase {
      display: inline-block;
      margin: 0 12px;
    }

    .features05-word {
      display: inline-block;
      margin: 0 6px;
      will-change: transform, opacity;
    }

    .features05-word--no {
      color: #1fbf73;
    }
  </style>

  <div id="root" data-composition-id="05-features" data-start="0" data-duration="5.1" data-width="1920" data-height="1080">
    <div class="features05-bg clip" data-start="0" data-duration="5.1" data-track-index="0"></div>

    <div id="features05-stage" class="clip" data-start="0" data-duration="5.1" data-track-index="1">
      <div id="features05-fan">
        <div class="features05-item features05-item--center" data-target-x="0" data-target-y="-14" data-target-rot="0">
          <div class="features05-card">
            <img class="features05-shot" src="assets/screen-monitor.png" alt="" />
          </div>
          <div class="features05-pill">Monitor</div>
        </div>
        <div class="features05-item features05-item--side features05-item--left" data-target-x="-600" data-target-y="20" data-target-rot="-4">
          <div class="features05-card">
            <img class="features05-shot" src="assets/screen-scanning.png" alt="" />
          </div>
          <div class="features05-pill">Check up</div>
        </div>
        <div class="features05-item features05-item--side features05-item--right" data-target-x="600" data-target-y="20" data-target-rot="4">
          <div class="features05-card">
            <img class="features05-shot" src="assets/screen-speed.png" alt="" />
          </div>
          <div class="features05-pill">Speed</div>
        </div>
      </div>

      <div id="features05-trust"></div>
    </div>
  </div>

  <script>
    (function () {
      const FRAME_ID = "05-features";
      const scope = document.querySelector('[data-composition-id="05-features"]');
      const q = (sel) => scope.querySelector(sel);
      const qa = (sel) => Array.from(scope.querySelectorAll(sel));

      const tl = gsap.timeline({ paused: true });

      // ---- Macro camera: very slow push under the whole shot ----
      tl.fromTo(q("#features05-stage"), { scale: 1 }, { scale: 1.015, duration: 4.5, ease: "none" }, 0);

      // ---- Scene 1 (0.0–1.8s): center-outward-expansion into a fan ----
      const ENTRY_AT = 0.1;
      const STAGGER = 0.07;
      const EXPAND_DUR = 1.1;
      const EXPAND_EASE = "power3.out";
      const items = qa(".features05-item"); // centre, left, right
      items.forEach((el, i) => {
        tl.fromTo(
          el,
          { xPercent: -50, yPercent: -50, x: 0, y: 0, rotation: 0, scale: 0.6, opacity: 0 },
          {
            x: Number(el.dataset.targetX),
            y: Number(el.dataset.targetY),
            rotation: Number(el.dataset.targetRot),
            scale: 1,
            opacity: 1,
            duration: EXPAND_DUR,
            ease: EXPAND_EASE,
          },
          ENTRY_AT + i * STAGGER,
        );
      });

      // Label pills as each card lands — read order left, centre, right
      const pillOrder = [
        q(".features05-item--left .features05-pill"),
        q(".features05-item--center .features05-pill"),
        q(".features05-item--right .features05-pill"),
      ];
      pillOrder.forEach((pill, i) => {
        tl.fromTo(
          pill,
          { opacity: 0, y: 14, scale: 0.92 },
          { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(1.6)" },
          0.9 + i * 0.18,
        );
      });

      // ---- Scene 2 (1.8–3.0s): fan eases back + dims, trust line assembles ----
      tl.fromTo(
        q("#features05-fan"),
        { scale: 1, y: 0, opacity: 1 },
        { scale: 0.95, y: 26, opacity: 0.7, duration: 0.9, ease: "power2.inOut" },
        1.8,
      );

      // dynamic-content-sequencing: phrase windows pre-computed from content length
      const CONTENT = ["No helper running as root.", "No account.", "No telemetry."];
      const SEQ_START = 1.85;
      const BASE_DURATION = 0.26;
      const SEC_PER_CHAR = 0.008;
      const WORD_STAGGER = 0.055;
      let cumulative = SEQ_START;
      const TIMELINE = CONTENT.map((text) => {
        const dur = BASE_DURATION + text.length * SEC_PER_CHAR;
        const start = cumulative;
        cumulative += dur;
        return { text, start, end: cumulative };
      });

      const trust = q("#features05-trust");
      TIMELINE.forEach((entry) => {
        const phrase = document.createElement("span");
        phrase.className = "features05-phrase";
        const words = entry.text.split(" ").map((w) => {
          const span = document.createElement("span");
          span.className = "features05-word" + (w === "No" ? " features05-word--no" : "");
          span.textContent = w;
          phrase.appendChild(span);
          return span;
        });
        trust.appendChild(phrase);
        words.forEach((span, wi) => {
          tl.fromTo(
            span,
            { opacity: 0, y: 28 },
            { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
            entry.start + wi * WORD_STAGGER,
          );
        });
      });

      // ---- Scene 3 (3.0–4.5s): hold, lit and still (camera push continues underneath) ----
      tl.set({}, {}, 4.5);

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
    })();
  </script>
</template>
