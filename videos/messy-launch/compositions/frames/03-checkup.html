<template>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>

    #root {
      position: absolute;
      inset: 0;

      overflow: hidden;
      font-family: "Nunito", sans-serif;
      color: #eaf7f4;
    }

    /* ground: full-bleed clip layer (never on #root) */
    [id="03-checkup-ground"] {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 58% 62% at 71% 42%, rgba(84, 214, 194, 0.09), rgba(84, 214, 194, 0) 70%),
        #071a1c;
    }

    /* ---- headline layer (left 30%) ---- */
    [id="03-checkup-copy"] {
      position: absolute;
      left: 96px;
      top: 300px;
      width: 560px;
    }
    [id="03-checkup-rule"] {
      width: 60px;

    [id="03-checkup-headline"] {
      font-size: 76px;

    }
    .w03-checkup-line {
      display: block;

      padding-bottom: 6px;
    }
    .w03-checkup-word {
      display: inline-block;
    }
    .w03-checkup-mess {
      color: #ff856b;
    }

    /* ---- camera stack (window, cursor, ripples) ---- */
    [id="03-checkup-cam"] {
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;
      will-change: transform;
    }
    [id="03-checkup-cam-inner"] {
      position: absolute;
      inset: 0;
      will-change: transform;
    }
    [id="03-checkup-win"] {
      position: absolute;
      left: 730px;
      top: 50px;
      width: 1100px;
      height: 772px;
      transform-origin: 50% 60%;
    }
    .s03-checkup-screen {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      overflow: hidden;
      transform-origin: 50% 50%;
      box-shadow:
        0 48px 90px rgba(0, 0, 0, 0.5),
        0 12px 28px rgba(0, 0, 0, 0.35);
    }
    .s03-checkup-screen img {
      display: block;
      width: 1100px;
      height: 772px;
    }
    [id="03-checkup-scan-screen"] {
      z-index: 2;
      opacity: 0;
    }
    [id="03-checkup-checkup-screen"] {
      z-index: 1;
    }

    /* Scan button press overlay (inside the check-up screen, window coords) */
    [id="03-checkup-btn-patch"] {
      position: absolute;
      left: 582px;
      top: 540px;
      width: 150px;
      height: 63px;
      border-radius: 32px;
      background: #0d191e;
      box-shadow: 0 0 14px 8px #0d191e;

    [id="03-checkup-btn"] {
      position: absolute;
      left: 591px;
      top: 547px;
      width: 132px;

      border-radius: 25px;
      background-image: url("assets/screen-checkup.png");
      background-size: 1100px 772px;
      background-position: -591px -547px;
      transform-origin: 50% 50%;
      opacity: 0;
    }

    /* ripples, centred on the Scan button (canvas coords 1387, 621) */
    .r03-checkup-ripple {
      position: absolute;
      left: 1355px;

      width: 64px;

      border-radius: 50%;
      border: 4px solid #1fbf73;

    [id="03-checkup-cursor"] svg {
      display: block;

      height: 46px;
      overflow: visible;
    }
  </style>

  <div id="root" data-composition-id="03-checkup" data-width="1920" data-height="1080" data-duration="5.5">
    <div id="03-checkup-ground" class="clip" data-start="0" data-duration="5.5" data-track-index="0"></div>

    <div id="03-checkup-cam" class="clip" data-start="0" data-duration="5.5" data-track-index="1" style="transform: scale(0.97)">
      <div id="03-checkup-cam-inner">
        <div id="03-checkup-win">
          <div id="03-checkup-checkup-screen" class="s03-checkup-screen">
            <img src="assets/screen-checkup.png" alt="" />
            <div id="03-checkup-btn-patch"></div>
            <div id="03-checkup-btn"></div>
          </div>
          <div id="03-checkup-scan-screen" class="s03-checkup-screen">
            <img src="assets/screen-scanning.png" alt="" />
          </div>
        </div>

        <div class="r03-checkup-ripple" id="03-checkup-ripple-1"></div>
        <div class="r03-checkup-ripple" id="03-checkup-ripple-2"></div>

        <div id="03-checkup-cursor">
          <svg viewBox="0 0 24 33" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M1.5 1.5 L1.5 26 L7.4 20.6 L11.4 30 L15.6 28.2 L11.7 19 L19.6 19 Z"
              fill="#ffffff"
              stroke="#071a1c"
              stroke-width="1.8"
              stroke-linejoin="round"
            />
          </svg>
        </div>
      </div>
    </div>

    <div id="03-checkup-copy" class="clip" data-start="0" data-duration="5.5" data-track-index="2">
      <div id="03-checkup-rule"></div>
      <div id="03-checkup-headline">
        <span class="w03-checkup-line"><span class="w03-checkup-word">One</span> <span class="w03-checkup-word">button</span></span>
        <span class="w03-checkup-line"><span class="w03-checkup-word">finds</span> <span class="w03-checkup-word">the</span></span>
        <span class="w03-checkup-line"><span class="w03-checkup-word w03-checkup-mess">mess.</span></span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const FID = "03-checkup";
      const $ = (id) => document.getElementById(FID + "-" + id);
      const root = document.querySelector('[data-composition-id="' + FID + '"]');
      const words = root.querySelectorAll(".w03-checkup-word");

      const cam = $("cam");
      const camInner = $("cam-inner");
      const win = $("win");
      const outgoing = $("checkup-screen");
      const incoming = $("scan-screen");
      const btn = $("btn");
      const btnPatch = $("btn-patch");
      const cursor = $("cursor");
      const ripples = [$("ripple-1"), $("ripple-2")];

      const TOTAL = 5;
      // Scan button centre in canvas coords (window left 730 / top 50, image 59.7% / 74.0%)
      const BTN_X = 1387;
      const BTN_Y = 621;
      // Cursor SVG tip sits ~2px inside the element box
      const TIP = 2;

      const tl = gsap.timeline({ paused: true });

      // ---------- Camera: multi-phase scale + micro drift (one writer) ----------
      const phase = { scale: 0.97 };
      // Phase 2 — settle to neutral as the window lands
      tl.to(phase, { scale: 1.0, duration: 1.4, ease: "power2.out" }, 0);
      // Phase 3 — small zoom toward the scanning ring (coordinate-target-zoom, nested:
      // outer scales, inner counter-translates; same position / duration / ease)
      const ZOOM_AT = 2.7;
      const ZOOM_DUR = 1.2;
      tl.to(phase, { scale: 1.07, duration: ZOOM_DUR, ease: "power2.inOut" }, ZOOM_AT);
      tl.fromTo(
        camInner,
        { x: 0, y: 0 },
        { x: -20, y: 40, duration: ZOOM_DUR, ease: "power2.inOut", immediateRender: false },
        ZOOM_AT
      );

      const drift = { p: 0 };
      tl.to(
        drift,
        {
          p: Math.PI * 2 * 1.2,
          duration: TOTAL,
          ease: "none",
          onUpdate: () => {
            const dx = Math.sin(drift.p) * 4;
            const dy = Math.sin(drift.p * 1.3) * 2;
            cam.style.transform = "scale(" + phase.scale + ") translate(" + dx + "px, " + dy + "px)";
          },
        },
        0
      );

      // ---------- Scene 1 (0.0–1.4): window tilts in from below and settles flat ----------
      tl.fromTo(
        win,
        { rotationX: 16, y: 110, transformPerspective: 1800 },
        { rotationX: 0, y: 0, transformPerspective: 1800, duration: 1.3, ease: "power3.out" },
        0
      );
      tl.fromTo(win, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0);

      // headline lands with the window
      tl.fromTo($("rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.75);
      tl.fromTo(
        words,
        { yPercent: 110, opacity: 0 },
        { yPercent: 0, opacity: 1, duration: 0.6, ease: "power3.out", stagger: 0.07 },
        0.85
      );

      // ---------- Scene 2 (1.4–2.4): cursor glides to Scan, presses, ripple ----------
      const CUR_START_X = 1720;
      const CUR_START_Y = 880 - 46;
      tl.fromTo(
        cursor,
        { x: CUR_START_X, y: CUR_START_Y, opacity: 0 },
        { opacity: 1, duration: 0.2, ease: "power1.out" },
        1.4
      );
      const MOVE_AT = 1.45;
      const MOVE_DUR = 0.6;
      tl.fromTo(
        cursor,
        { x: CUR_START_X, y: CUR_START_Y },
        { x: BTN_X - TIP, y: BTN_Y - TIP, duration: MOVE_DUR, ease: "back.out(1.3)", immediateRender: false },
        MOVE_AT
      );

      const CLICK_AT = MOVE_AT + MOVE_DUR + 0.12; // 2.17
      const PRESS = 0.09;
      // press overlay takes over the button just before the click (pixel-identical at rest)
      tl.set([btnPatch, btn], { opacity: 0 }, 0);
      tl.set([btnPatch, btn], { opacity: 1 }, CLICK_AT - 0.05);
      // cursor depresses more than the target (explicit down then up)
      tl.fromTo(cursor, { scale: 1 }, { scale: 0.84, duration: PRESS, ease: "power2.in", immediateRender: false }, CLICK_AT);
      tl.to(cursor, { scale: 1, duration: PRESS, ease: "power2.out" }, CLICK_AT + PRESS);
      // button compresses, then springs back
      tl.fromTo(btn, { scale: 1 }, { scale: 0.93, duration: PRESS, ease: "power2.in", immediateRender: false }, CLICK_AT);
      tl.to(btn, { scale: 1, duration: 0.45, ease: "back.out(3)" }, CLICK_AT + PRESS);

      const RIPPLE_AT = CLICK_AT + 0.03;
      tl.fromTo(
        ripples,
        { scale: 0, opacity: 1 },
        { scale: 4, opacity: 0, duration: 0.65, ease: "power2.out", stagger: 0.09, immediateRender: false },
        RIPPLE_AT
      );
      tl.set(ripples, { scale: 0, opacity: 0 }, 0);

      // ---------- Scene 3 (2.4–3.6): scale-swap to the scanning screen, cursor fades ----------
      const SWAP_AT = 2.45;
      const EXIT_DUR = 0.35;
      const ENTER_DUR = 0.6;
      const OVERLAP = 0.15;
      const EXIT_SCALE = 0.92;
      tl.fromTo(
        outgoing,
        { scale: 1, opacity: 1 },
        { scale: EXIT_SCALE, opacity: 0, duration: EXIT_DUR, ease: "power2.in", immediateRender: false },
        SWAP_AT
      );
      tl.fromTo(
        incoming,
        { scale: EXIT_SCALE, opacity: 0 },
        { scale: 1, opacity: 1, duration: ENTER_DUR, ease: "back.out(1.4)" },
        SWAP_AT + EXIT_DUR - OVERLAP
      );
      tl.to(cursor, { opacity: 0, y: BTN_Y - TIP + 14, duration: 0.35, ease: "power2.in" }, SWAP_AT);

      // ---------- Scene 4 (3.6–5.0): hold on the scanning window (camera drift only) ----------

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
