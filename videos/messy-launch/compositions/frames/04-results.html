          <span class="r04-line"><span class="r04-word">press</span><span class="r04-word r04-word-run">Run.</span></span>
        </h2>
        <div class="r04-sub" id="r04-sub">
          <span class="r04-sub-word">Everything</span><span class="r04-sub-word">goes</span><span class="r04-sub-word">to</span><span class="r04-sub-word">the</span><span class="r04-sub-word">Trash</span><span class="r04-sub-word">first.</span>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var FRAME_ID = "04-results";
        var DURATION = 4.5;
        var scope = document.querySelector('[data-composition-id="' + FRAME_ID + '"]') || document;
        var q = function (sel) { return scope.querySelector(sel); };
        var qa = function (sel) { return Array.prototype.slice.call(scope.querySelectorAll(sel)); };

        var tl = gsap.timeline({ paused: true });

        /* ---------- Scene 1 (0.0–1.5): window settles left, camera eases to the banner ---------- */
        tl.fromTo(
          "#r04-window",
          { x: -70, scale: 0.97, opacity: 0 },
          { x: 0, scale: 1, opacity: 1, duration: 0.7, ease: "power2.out" },
          0
        );
        tl.fromTo("#r04-shot", { filter: "blur(6px)" }, { filter: "blur(0px)", duration: 0.9, ease: "power2.out" }, 0.1);

        // coordinate-target-zoom (nested wrappers, T = -offset).
        // Image geometry is fixed: shot displayed at 1100x772 (source 1960x1376, k = 0.5612).
        // Banner sits at x 232–1081, y 132–255 (display px); coral amount center ≈ (537, 183).
        // Target clamped so the raster still covers the window at S = 1.25:
        // targetY >= 386 / 1.25 = 309; targetX in [440, 660].
        var ZOOM_SCALE = 1.25;
        var FRAME_CX = 550, FRAME_CY = 386;
        var TARGET_X = 650, TARGET_Y = 309;
        var OFFSET_X = TARGET_X - FRAME_CX; // 100
        var OFFSET_Y = TARGET_Y - FRAME_CY; // -77
        var ZOOM_AT = 0.3, ZOOM_DUR = 1.2;
        tl.fromTo("#r04-zoom-outer", { scale: 1 }, { scale: ZOOM_SCALE, duration: ZOOM_DUR, ease: "power3.inOut" }, ZOOM_AT);
        tl.fromTo("#r04-zoom-inner", { x: 0, y: 0 }, { x: -OFFSET_X, y: -OFFSET_Y, duration: ZOOM_DUR, ease: "power3.inOut" }, ZOOM_AT);
        tl.fromTo("#r04-falloff", { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power2.inOut" }, 0.6);

        // asr-keyword-glow: one linear driver, attack/sustain/release envelope on the coral amount
        var GLOW = { start: 0.85, end: 1.75 };
        var ATTACK_DUR = 0.25, RELEASE = 0.7, REST_LEVEL = 0.45, MAX_SCALE_BOOST = 0.18;
        function envelope(time, start, end) {
          if (time < start) return 0;
          if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
          var releaseEnd = end + RELEASE;
          if (time < releaseEnd) return 1 - ((time - end) / RELEASE) * (1 - REST_LEVEL);
          return REST_LEVEL;
        }
        var glowEl = q("#r04-glow");
        var driver = { t: 0 };
        tl.to(
          driver,
          {
            t: DURATION,
            duration: DURATION,
            ease: "none",
            onUpdate: function () {
              var env = envelope(driver.t, GLOW.start, GLOW.end);
              glowEl.style.opacity = String(env);
              glowEl.style.transform = "scale(" + (1 + MAX_SCALE_BOOST * env) + ")";
            },
          },
          0
        );
        tl.fromTo("#r04-underline", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 1.0);

        /* ---------- Scene 2 (1.5–2.8): headline, word by word, line by line ---------- */
        // dynamic-content-sequencing: per-word windows pre-computed once from content length,
        // then fitted into the Scene 2 window.
        tl.fromTo("#r04-accent", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 1.4);
        var BASE_DURATION = 0.12, SEC_PER_CHAR = 0.02;
        var S2_START = 1.5, S2_LAST_START = 2.4, WORD_DUR = 0.5;
        var words = qa("#r04-headline .r04-word");
        var cumulative = 0;
        var seq = words.map(function (el) {
          var start = cumulative;
          cumulative += BASE_DURATION + el.textContent.length * SEC_PER_CHAR;
          return { el: el, start: start };
        });
        var lastRaw = seq.length ? seq[seq.length - 1].start : 0;
        var fit = lastRaw > 0 ? (S2_LAST_START - S2_START) / lastRaw : 0;
        seq.forEach(function (entry) {
          tl.fromTo(
            entry.el,
            { y: 34, opacity: 0, filter: "blur(8px)" },
            { y: 0, opacity: 1, filter: "blur(0px)", duration: WORD_DUR, ease: "power3.out" },
            S2_START + entry.start * fit
          );
        });

        /* ---------- Scene 3 (2.8–4.5): the second promise in text-muted, then a held read ---------- */
        var subWords = qa("#r04-sub .r04-sub-word");
        var S3_START = 2.8, S3_STEP = 0.07;
        subWords.forEach(function (el, i) {
          tl.fromTo(
            el,
            { y: 22, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
            S3_START + i * S3_STEP
          );
        });
        // held read 3.8–4.5: camera still, glow resting at REST_LEVEL.

        window.__timelines = window.__timelines || {};
        window.__timelines[FRAME_ID] = tl;
      })();
    </script>
