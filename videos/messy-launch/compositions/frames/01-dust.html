<template>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    #root {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: "Nunito", sans-serif;
    }
    [class~="f01-dust-bg"] {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 72% 70%, rgba(84, 214, 194, 0.07), rgba(7, 26, 28, 0) 70%),
        #071a1c;
    }
    [class~="f01-dust-stage"] {
      position: absolute;
      inset: 0;
    }
    [class~="f01-dust-line"] {
      position: absolute;
      left: 128px;
      font-size: 120px;
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }
    [class~="f01-dust-line1"] {
      top: 196px;
      color: #eaf7f4;
    }
    [class~="f01-dust-line2"] {
      top: 352px;
      color: #ff856b;
    }
    [class~="f01-dust-word"] {
      display: inline-block;
      margin-right: 0.24em;
      will-change: transform, opacity, filter;
    }
    [class~="f01-dust-bunny"] {
      position: absolute;
    }
    [class~="f01-dust-bunny"] img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    /* front bunny (focal): lower-right, largest — bottom edge 850 < 900 keep-out */
    [class~="f01-dust-b1"] {
      left: 1330px;
      top: 540px;
      width: 310px;
      height: 310px;
    }
    /* back layer: smaller, slightly receded */
    [class~="f01-dust-b2"] {
      left: 1130px;
      top: 676px;
      width: 180px;
      height: 180px;
      opacity: 0.88;
    }
    [class~="f01-dust-b3"] {
      left: 1650px;
      top: 700px;
      width: 150px;
      height: 150px;
      opacity: 0.8;
    }
  </style>

  <div
    id="root"
    data-composition-id="01-dust"
    data-start="0"
    data-duration="3.9"
    data-width="1920"
    data-height="1080"
  >
    <div class="f01-dust-bg clip" data-start="0" data-duration="3.9" data-track-index="0"></div>

    <div class="f01-dust-stage clip" data-start="0" data-duration="3.9" data-track-index="1">
      <!-- back depth layer -->
      <div id="f01-dust-b2" class="f01-dust-bunny f01-dust-b2">
        <img src="assets/dust-idle.png" alt="" />
      </div>
      <div id="f01-dust-b3" class="f01-dust-bunny f01-dust-b3">
        <img src="assets/dust-idle.png" alt="" />
      </div>

      <!-- front depth layer: the focal bunny (idle -> scared hard swap) -->
      <div id="f01-dust-b1" class="f01-dust-bunny f01-dust-b1">
        <img id="f01-dust-b1-idle" src="assets/dust-idle.png" alt="" />
        <img id="f01-dust-b1-scared" src="assets/dust-scared.png" alt="" style="opacity: 0" />
      </div>

      <div id="f01-dust-line1" class="f01-dust-line f01-dust-line1"></div>
      <div id="f01-dust-line2" class="f01-dust-line f01-dust-line2"></div>
    </div>
  </div>

  <script>
    (function () {
      const FRAME_ID = "01-dust";
      const DURATION = 3.5;
      const $ = (id) => document.getElementById(id);

      // Build word spans once (static markup, deterministic).
      function fill(el, words) {
        return words.map((w) => {
          const s = document.createElement("span");
          s.className = "f01-dust-word";
          s.textContent = w;
          el.appendChild(s);
          return s;
        });
      }
      const line1 = $("f01-dust-line1");
      const line2 = $("f01-dust-line2");
      const w1 = fill(line1, ["Your", "Mac", "collects", "dust."]);
      const w2 = fill(line2, ["Caches.", "Logs.", "Leftovers."]);

      const b1 = $("f01-dust-b1");
      const b2 = $("f01-dust-b2");
      const b3 = $("f01-dust-b3");
      const b1Idle = $("f01-dust-b1-idle");
      const b1Scared = $("f01-dust-b1-scared");

      const tl = gsap.timeline({ paused: true });

      // ── Scene 1 (0.0–1.3s): per-word assembly, content-paced (dynamic-content-sequencing) ──
      // Onsets precomputed once from word length: BASE + chars × SEC_PER_CHAR.
      const BASE = 0.12;
      const SEC_PER_CHAR = 0.03;
      let cursor = 0.05;
      const ONSETS1 = w1.map((el) => {
        const start = cursor;
        cursor += BASE + el.textContent.length * SEC_PER_CHAR;
        return start;
      });
      w1.forEach((el, i) => {
        tl.fromTo(
          el,
          { opacity: 0, y: 34, filter: "blur(10px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.42, ease: "power3.out" },
          ONSETS1[i],
        );
      });

      // Front bunny rolls in from the left and settles lower-right.
      // Rotation matches travel distance / circumference so it reads as a true roll.
      const ROLL_X = -1500;
      const ROLL_ROT = (ROLL_X / (Math.PI * 310)) * 360;
      tl.fromTo(
        b1,
        { x: ROLL_X, rotation: ROLL_ROT },
        { x: 0, rotation: 0, duration: 1.0, ease: "power2.out" },
        0.12,
      );
      // landing settle: soft squash and recover
      tl.fromTo(
        b1,
        { scaleY: 0.9, scaleX: 1.06, transformOrigin: "50% 100%" },
        { scaleY: 1, scaleX: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false },
        1.08,
      );

      // ── Scene 2 (1.3–2.6s): line 1 dims; line 2 slams word by word (kinetic-beat-slam) ──
      const PULSE = 0.4;
      const BEATS = [1.35, 1.35 + PULSE, 1.35 + PULSE * 2]; // 1.35, 1.75, 2.15

      tl.fromTo(line1, { color: "#EAF7F4" }, { color: "#8FDCCD", duration: 0.35, ease: "power1.out" }, 1.3);

      // Distinct entrance per word.
      tl.fromTo(
        w2[0],
        { opacity: 0, scale: 1.5, filter: "blur(16px)", transformOrigin: "0% 60%" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "power4.out" },
        BEATS[0],
      );
      tl.fromTo(
        w2[1],
        { opacity: 0, x: -220 },
        { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" },
        BEATS[1],
      );
      tl.fromTo(
        w2[2],
        { opacity: 0, y: 90, rotation: 6, transformOrigin: "0% 100%" },
        { opacity: 1, y: 0, rotation: 0, duration: 0.42, ease: "circ.out" },
        BEATS[2],
      );

      // Two more bunnies drop in beside the first, on the same beats.
      tl.fromTo(
        b2,
        { y: -1080, rotation: -18 },
        { y: 0, rotation: 0, duration: 0.5, ease: "bounce.out" },
        BEATS[1] - 0.05,
      );
      tl.fromTo(
        b3,
        { y: -1080, rotation: 14 },
        { y: 0, rotation: 0, duration: 0.45, ease: "bounce.out" },
        BEATS[2] - 0.05,
      );

      // ── Scene 3 (2.6–3.5s): hold; front bunny hard-swaps to scared (no fade) ──
      const SWAP = 2.6;
      tl.set(b1Idle, { opacity: 1 }, 0);
      tl.set(b1Scared, { opacity: 0 }, 0);
      tl.set(b1Idle, { opacity: 0 }, SWAP);
      tl.set(b1Scared, { opacity: 1 }, SWAP);
      // a tiny startle hop, then stillness
      tl.fromTo(b1, { y: 0 }, { y: -16, duration: 0.09, ease: "power2.out", immediateRender: false }, SWAP);
      tl.to(b1, { y: 0, duration: 0.18, ease: "power2.in" }, SWAP + 0.09);

      // pad the timeline to the exact frame length
      tl.set({}, {}, DURATION);

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
    })();
  </script>
</template>
