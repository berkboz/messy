  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      // ── Scene 1 (0.0–1.0s): broom springs up from below with squash & stretch ──
      // Rise (stretched), then a linear "press" squash on landing, then a back.out spring release.
      const RISE_START = 0.0;
      const RISE_DUR = 0.34;
      const PRESS_START = RISE_START + RISE_DUR; // 0.34
      const PRESS_DUR = 0.12;
      const RELEASE_START = PRESS_START + PRESS_DUR; // 0.46 (adjacency = state continuity)
      const RELEASE_DUR = 0.6;
      const BOUNCE_FACTOR = 2.2;

      tl.fromTo(
        "#meet-hop",
        { y: 420, opacity: 0 },
        { y: 0, opacity: 1, duration: RISE_DUR, ease: "power2.out" },
        RISE_START,
      );
      tl.fromTo(
        "#meet-squash",
        { scaleX: 0.86, scaleY: 1.16 },
        { scaleX: 0.94, scaleY: 1.06, duration: RISE_DUR, ease: "power1.out" },
        RISE_START,
      );
      // Press: linear compression on landing
      tl.to(
        "#meet-squash",
        { scaleX: 1.12, scaleY: 0.86, duration: PRESS_DUR, ease: "power1.in" },
        PRESS_START,
      );
      // Release: spring back to rest
      tl.to(
        "#meet-squash",
        { scaleX: 1, scaleY: 1, duration: RELEASE_DUR, ease: "back.out(" + BOUNCE_FACTOR + ")" },
        RELEASE_START,
      );
      // Burst glow behind the broom on release, then fade
      tl.fromTo(
        "#meet-burst",
        { scale: 1, opacity: 0 },
        { scale: 6, opacity: 0.55, duration: 0.45, ease: "power2.out" },
        RELEASE_START,
      );
      tl.to("#meet-burst", { opacity: 0, duration: 0.5, ease: "power2.in" }, RELEASE_START + 0.45);
      // Environmental glow settles in under the hero
      tl.fromTo(
        "#meet-env-glow",
        { opacity: 0 },
        { opacity: 1, duration: 0.8, ease: "power2.out" },
        RELEASE_START,
      );

      // Three mint sparkles pop around the broom (staggered, soft overshoot)
      const SPARKS = [
        { sel: "#meet-spark-1", at: 0.52, rot: -30 },
        { sel: "#meet-spark-2", at: 0.62, rot: 25 },
        { sel: "#meet-spark-3", at: 0.72, rot: -20 },
      ];
      SPARKS.forEach(function (s) {
        tl.fromTo(
          s.sel,
          { scale: 0, rotation: s.rot, opacity: 0 },
          { scale: 1, rotation: 0, opacity: 1, duration: 0.42, ease: "back.out(2.6)" },
          s.at,
        );
      });

      // ── Scene 2 (1.0–2.1s): icon fades in, wordmark writes letter by letter, squiggle draws ──
      tl.fromTo(
        "#meet-icon",
        { opacity: 0, scale: 0.88 },
        { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" },
        1.0,
      );

      // Letter sequence: start/end pre-computed once from content (dynamic-content-sequencing)
      const LETTER_BASE = 1.15;
      const LETTER_STEP = 0.075;
      const LETTER_DUR = 0.38;
      const letters = Array.prototype.slice.call(
        document.querySelectorAll("#meet-wordmark .meet-letter"),
      );
      const LETTER_TIMELINE = letters.map(function (el, i) {
        const start = LETTER_BASE + i * LETTER_STEP;
        return { el: el, start: start, end: start + LETTER_DUR };
      });
      LETTER_TIMELINE.forEach(function (entry) {
        tl.fromTo(
          entry.el,
          { opacity: 0, y: 56, scaleY: 0.7 },
          { opacity: 1, y: 0, scaleY: 1, duration: LETTER_DUR, ease: "back.out(1.8)" },
          entry.start,
        );
      });

      // Coral squiggle self-draws left → right under the wordmark (measured length)
      const squiggle = document.querySelector("#meet-squiggle-path");
      const len = squiggle.getTotalLength() * 1.05;
      squiggle.style.strokeDasharray = String(len);
      squiggle.style.strokeDashoffset = String(len);
      tl.fromTo(
        squiggle,
        { strokeDashoffset: len },
        { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
        1.42,
      );

      // ── Scene 3 (2.1–3.5s): tagline rises in, then a held read ──
      tl.fromTo(
        "#meet-tagline",
        { opacity: 0, y: 34 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" },
        2.1,
      );
      // Barely-perceptible slow push under the hold so the still read never freezes
      tl.fromTo(
        "#meet-stage",
        { scale: 1 },
        { scale: 1.015, duration: 3.5, ease: "none" },
        0,
      );

      window.__timelines["02-meet"] = tl;
